<!DOCTYPE html>
<html>
<head>
    <title>Crop Recommendation</title>
</head>
<body>
      <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #75ec3e, #a8e063);
            text-align: center;
            padding: 50px;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-image: url("/static/sprawling-agricultural-farm-featuring-fields-of-crops-ai-generated-photo.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            }

        

    h2 {
            color: white;
        }
        form {
            background: rgba(151, 192, 104, 0.8);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            transparant: 0.3;
        }

        input {
            margin: 8px;
            padding: 8px;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            color: yellow;
        }
    </style>

    <h2>Crop Recommendation System 🌱</h2>

    <form id="form">
        N: <input type="number" id="N"><br><br>
        P: <input type="number" id="P"><br><br>
        K: <input type="number" id="K"><br><br>
        Temperature: <input type="number" id="temperature"><br><br>
        Humidity: <input type="number" id="humidity"><br><br>
        pH: <input type="number" id="ph"><br><br>
        Rainfall: <input type="number" id="rainfall"><br><br>

        <button type="submit">Predict</button>
    </form>

    

    <h3 id="result"></h3>
    <input type="text" id="city" placeholder="Enter City"><br>
<button type="button" onclick="getWeather()">Auto Fill Weather</button>

    <script>
        document.getElementById("form").addEventListener("submit", async function(e) {
            e.preventDefault();

            const data = {
                N: parseInt(document.getElementById("N").value),
                P: parseInt(document.getElementById("P").value),
                K: parseInt(document.getElementById("K").value),
                temperature: parseFloat(document.getElementById("temperature").value),
                humidity: parseFloat(document.getElementById("humidity").value),
                ph: parseFloat(document.getElementById("ph").value),
                rainfall: parseFloat(document.getElementById("rainfall").value)
            };

            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            document.getElementById("result").innerText = "Recommended Crop: " + result.crop;
        });
        async function getWeather() {
    const city = document.getElementById("city").value;

    const response = await fetch("/weather", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ city: city })
    });

    const data = await response.json();

    document.getElementById("temperature").value = data.temperature;
    document.getElementById("humidity").value = data.humidity;
    
}
    </script>

</body>
</html>
